[package]
name = "fastp"
kind = "tool"
version = "1.3.3"
release = 2
license = "Apache-2.0"
main = "src/main.taf"

[meta]
domain = "bio"
categories = ["fastq", "quality-control", "preprocessing", "trimming", "sequencing"]
keywords = ["fastp", "fastq", "qc", "quality-control", "adapter-trimming", "filtering", "umi", "deduplication", "html-report", "json-report", "illumina", "mgi", "paired-end"]
description = "Ultrafast all-in-one FASTQ preprocessing and quality control with filtering, trimming, adapter detection, UMI, deduplication, and HTML/JSON reports."

[repository]
url = "https://github.com/taffish/fastp"

[command]
name = "taf-fastp"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/fastp:1.3.3-r2"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[upstream]
name = "fastp"
type = "github"
repo = "OpenGene/fastp"
homepage = "https://github.com/OpenGene/fastp"
release_url = "https://github.com/OpenGene/fastp/releases/tag/v1.3.3"
downloads = "https://github.com/OpenGene/fastp/archive/refs/tags/v1.3.3.tar.gz"
version = "1.3.3"
license = "MIT"
citation = "Chen 2025; Chen 2023; Chen et al. 2018"
doi = "10.1002/imt2.70078; 10.1002/imt2.107; 10.1093/bioinformatics/bty560"
pmid = "41112039; 30423086"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 180
exist = ["fastp", "parallel.py", "python", "python3"]
test = ["fastp --version | grep -Fx 'fastp 1.3.3' >/dev/null", "fastp --help 2>&1 | grep -F 'usage:' >/dev/null", "parallel.py -h 2>&1 | grep -F 'A python script to use fastp' >/dev/null", "ldd $(command -v fastp) | grep -F 'libisal' >/dev/null", "mkdir -p /tmp/taf-fastp-smoke && cd /tmp/taf-fastp-smoke && printf '@r1\\nACGTACGTACGTACGTACGT\\n+\\nFFFFFFFFFFFFFFFFFFFF\\n@r2\\nACGTACGTNNNNACGTACGT\\n+\\nFFFFFFFF!!!!FFFFFFFF\\n' > reads.fq && fastp -i reads.fq -o clean.fq -h report.html -j report.json -w 1 >/tmp/taf-fastp-se.log 2>&1 && test -s clean.fq && test -s report.html && test -s report.json && grep -F '\"fastp_version\": \"' report.json >/dev/null && grep -F '@r1' clean.fq >/dev/null", "mkdir -p /tmp/taf-fastp-stdin && cd /tmp/taf-fastp-stdin && printf '@r1\\nACGTACGTACGTACGTACGT\\n+\\nFFFFFFFFFFFFFFFFFFFF\\n@r2\\nACGTACGTNNNNACGTACGT\\n+\\nFFFFFFFF!!!!FFFFFFFF\\n' > reads.fq && fastp --stdin --stdout -w 1 < reads.fq > stdout.fq 2>/tmp/taf-fastp-stdin.log && grep -F '@r1' stdout.fq >/dev/null", "mkdir -p /tmp/taf-fastp-pe && cd /tmp/taf-fastp-pe && printf '@p1/1\\nACGTACGTACGTACGTACGT\\n+\\nFFFFFFFFFFFFFFFFFFFF\\n' > r1.fq && printf '@p1/2\\nTGCATGCATGCATGCATGCA\\n+\\nFFFFFFFFFFFFFFFFFFFF\\n' > r2.fq && fastp -i r1.fq -I r2.fq -o out1.fq.gz -O out2.fq.gz -h pe.html -j pe.json -w 1 >/tmp/taf-fastp-pe.log 2>&1 && test -s out1.fq.gz && test -s out2.fq.gz && test -s pe.html && test -s pe.json", "mkdir -p /tmp/taf-fastp-parallel && cd /tmp/taf-fastp-parallel && printf '@p1/1\\nACGTACGTACGTACGTACGT\\n+\\nFFFFFFFFFFFFFFFFFFFF\\n' > r1.fq && printf '@p1/2\\nTGCATGCATGCATGCATGCA\\n+\\nFFFFFFFFFFFFFFFFFFFF\\n' > r2.fq && mkdir -p batch-in batch-out batch-report && cp r1.fq batch-in/sample_R1.fq && cp r2.fq batch-in/sample_R2.fq && parallel.py -i batch-in -o batch-out -r batch-report -p 1 -a '-w 1' >/tmp/taf-fastp-parallel.log && test -s batch-out/sample_R1.clean.fastq.gz && test -s batch-out/sample_R2.clean.fastq.gz && test -s batch-report/sample_pe.fq.html && test -s batch-report/sample_pe.fq.json && test -s batch-report/overall.html"]

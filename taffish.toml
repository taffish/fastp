[package]
name = "fastp"
kind = "tool"
version = "1.3.7"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/fastp"

[command]
name = "taf-fastp"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/fastp:1.3.7-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["fastq", "quality-control", "preprocessing", "trimming", "sequencing"]
keywords = ["fastp", "fastq", "qc", "quality-control", "adapter-trimming", "filtering", "umi", "deduplication", "html-report", "json-report", "illumina", "mgi", "paired-end"]
description = "Ultrafast all-in-one FASTQ preprocessing and quality control with filtering, trimming, adapter detection, UMI, deduplication, and HTML/JSON reports."

[upstream]
name = "fastp"
type = "github"
repo = "OpenGene/fastp"
homepage = "https://github.com/OpenGene/fastp"
release_url = "https://github.com/OpenGene/fastp/releases/tag/v1.3.7"
downloads = "https://github.com/OpenGene/fastp/archive/refs/tags/v1.3.7.tar.gz; https://github.com/intel/isa-l/archive/refs/tags/v2.31.0.tar.gz; https://github.com/ebiggers/libdeflate/archive/refs/tags/v1.25.tar.gz; https://github.com/google/highway/archive/refs/tags/1.3.0.tar.gz"
version = "1.3.7"
license = "MIT"
citation = "Chen 2025; Chen 2023; Chen et al. 2018"
doi = "10.1002/imt2.70078; 10.1002/imt2.107; 10.1093/bioinformatics/bty560"
pmid = "41112039; 30423086"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 180
exist = ["fastp", "parallel.py", "python", "python3", "fastp-report-offline"]
test = [ "fastp --version | grep -Fx 'fastp 1.3.7' >/dev/null", "fastp --help 2>&1 | grep -F 'usage:' >/dev/null", "parallel.py -h 2>&1 | grep -F 'A python script to use fastp' >/dev/null", "ldd $(command -v fastp) | grep -F 'libisal' >/dev/null", "fastp-report-offline --help | grep -F 'self-contained offline fastp' >/dev/null", "python3 /usr/local/share/fastp/fastp-smoke.py se", "python3 /usr/local/share/fastp/fastp-smoke.py thread-cap", "python3 /usr/local/share/fastp/fastp-smoke.py stdin", "python3 /usr/local/share/fastp/fastp-smoke.py paired", "python3 /usr/local/share/fastp/fastp-smoke.py bgzf", "python3 /usr/local/share/fastp/fastp-smoke.py fifo", "python3 /usr/local/share/fastp/fastp-smoke.py batch", "python3 /usr/local/share/fastp/fastp-smoke.py offline-report", "python3 /usr/local/share/fastp/fastp-smoke.py negative", "python3 /usr/local/share/fastp/fastp-smoke.py licenses"]
